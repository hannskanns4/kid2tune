{% extends "base.html" %}
{% block title %}{{ t("history.title") }} – kid2tune{% endblock %}

{% block content %}
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <h4 class="mb-0">{{ t("history.title") }}</h4>
    <button class="btn btn-outline-danger btn-sm" onclick="clearHistory()" id="btn-clear">
      {{ t("history.clear") }}
    </button>
  </div>
  <p class="text-muted small">{{ t("history.desc") }}</p>

  <div id="history-list" class="d-flex flex-column gap-2">
    {% if not history %}
    <p class="text-muted text-center mt-4" id="empty-msg">{{ t("history.empty") }}</p>
    {% endif %}
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const _th = {
  empty:           {{ t("history.empty")|tojson }},
  confirm_clear:   {{ t("history.confirm_clear")|tojson }},
  error_msg:       {{ t("common.error_msg")|tojson }},
  play_again:      {{ t("history.play_again")|tojson }},
  save_card:       {{ t("history.save_card")|tojson }},
  saved:           {{ t("history.saved")|tojson }},
  unknown_title:   {{ t("common.no_title")|tojson }}
};

function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function fmtAge(ts){
  if(!ts) return '';
  const diff = Math.max(0, (Date.now()/1000) - ts);
  if(diff < 60) return Math.round(diff) + 's';
  if(diff < 3600) return Math.round(diff/60) + 'min';
  if(diff < 86400) return Math.round(diff/3600) + 'h';
  return Math.round(diff/86400) + 'd';
}

function artSrc(it){
  const a = it.artwork || '';
  if(!a) return '';
  if(/^https?:\/\//.test(a)) return a;
  return '/api/artwork/lms?path=' + encodeURIComponent(a);
}

function thumbHtml(it){
  const src = artSrc(it);
  const ph = `<div class="history-thumb history-thumb-placeholder"${src ? ' style="display:none;"' : ''}>&#9834;</div>`;
  if(!src) return ph;
  return `<img class="history-thumb" src="${escapeHtml(src)}" alt=""
               onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">` + ph;
}

function typeBadge(it){
  const v = it.value || '';
  if(v.startsWith('spotify:') || v.includes('open.spotify.com'))
    return '<span class="badge badge-spotify">Spotify</span>';
  if((it.type || '') === 'url')
    return '<span class="badge badge-url">URL</span>';
  return '<span class="badge bg-secondary">' + escapeHtml(it.type || '') + '</span>';
}

let _items = [];
function renderHistory(items){
  const list = document.getElementById('history-list');
  list.innerHTML = '';
  if(!items.length){
    list.innerHTML = '<p class="text-muted text-center mt-4">'+ _th.empty +'</p>';
    return;
  }
  _items = items;
  items.forEach((it, idx) => {
    const card = document.createElement('div');
    card.className = 'card p-3';
    const title  = escapeHtml(it.title || it.label || _th.unknown_title);
    const artist = escapeHtml(it.artist || '');
    const value  = escapeHtml(it.value || '');
    const age    = fmtAge(it.timestamp);
    card.innerHTML = `
      <div class="d-flex align-items-center gap-3 flex-wrap">
        ${thumbHtml(it)}
        <div class="flex-grow-1" style="min-width:0;">
          <div class="history-title text-truncate">${title}</div>
          ${artist ? '<div class="history-artist text-truncate">'+artist+'</div>' : ''}
          <div class="history-meta text-truncate">
            ${typeBadge(it)}
            <span class="ms-1">${value}</span>
          </div>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span class="history-meta history-age" data-ts="${it.timestamp || ''}">${age}</span>
          <button class="btn btn-outline-light btn-sm"
                  onclick="savePending(${idx}, this)" title="${_th.save_card}">
            &#128190; ${_th.save_card}
          </button>
          <button class="btn btn-success btn-sm" onclick="playEntry(${idx})">
            &#9654; ${_th.play_again}
          </button>
        </div>
      </div>`;
    list.appendChild(card);
  });
}

let _lastJson = '';
function loadHistory(){
  fetch('/api/history').then(r => r.json()).then(items => {
    const j = JSON.stringify(items);
    if(j === _lastJson) return;   // avoids flicker + keeps button states
    _lastJson = j;
    renderHistory(items);
  }).catch(()=>{});
}

function refreshAges(){
  document.querySelectorAll('.history-age').forEach(el => {
    const ts = parseFloat(el.dataset.ts);
    if(ts) el.textContent = fmtAge(ts);
  });
}

function playEntry(idx){
  const entry = _items[idx];
  if(!entry) return;
  fetch('/api/history/play', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      type:  entry.type,
      value: entry.value,
      label: entry.label || entry.title || ''
    })
  }).then(r => r.json()).then(d => {
    if(!d.ok) alert(_th.error_msg + ' ' + d.message);
    else setTimeout(loadHistory, 500);
  }).catch(e => alert(_th.error_msg + ' ' + e));
}

function savePending(idx, btn){
  const entry = _items[idx];
  if(!entry) return;
  fetch('/rfid/pending/add', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      type:  entry.type,
      value: entry.value,
      label: entry.label || entry.title || ''
    })
  }).then(r => r.json()).then(d => {
    if(d.ok){ btn.disabled = true; btn.innerHTML = '&#10003; ' + _th.saved; }
    else alert(_th.error_msg.replace('{msg}', d.message || ''));
  }).catch(e => alert(_th.error_msg.replace('{msg}', e)));
}

function clearHistory(){
  if(!confirm(_th.confirm_clear)) return;
  fetch('/api/history/clear', {method:'POST'})
    .then(() => loadHistory());
}

loadHistory();
setInterval(() => { loadHistory(); refreshAges(); }, 5000);
</script>
{% endblock %}
